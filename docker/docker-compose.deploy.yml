version: "3.8"

services:
  publisher:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-publisher
    volumes:
      - ../src:/workspaces/code/src
    working_dir: /workspaces/code
    command: >
      bash -c "source /opt/ros/humble/setup.bash && 
               colcon build --packages-select basic_topic && 
               source install/setup.bash && 
               ros2 run basic_topic publisher_node"

  subscriber:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-subscriber
    volumes:
      - ../src:/workspaces/code/src
    working_dir: /workspaces/code
    command: >
      bash -c "source /opt/ros/humble/setup.bash && 
               colcon build --packages-select basic_topic && 
               source install/setup.bash && 
               ros2 run basic_topic subscriber_node"