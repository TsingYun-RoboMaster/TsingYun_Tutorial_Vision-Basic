# TODO
version: "3.8"

services:

  publisher:
    image: basic:deploy

    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy

    container_name: publisher-container

    working_dir: /workspaces/code

    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspaces/code/install/setup.bash &&
      ros2 run basic_topic publisher_node
      "

  subscriber:
    image: basic:deploy

    container_name: subscriber-container

    working_dir: /workspaces/code

    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0

    command: >
      bash -c "
      source /opt/ros/humble/setup.bash &&
      source /workspaces/code/install/setup.bash &&
      ros2 run basic_topic subscriber_node
      "