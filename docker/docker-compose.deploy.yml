version: "3.8"

services:
  basic-publisher:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-publisher
    environment:
      ROS_DOMAIN_ID: "7"
      ROS_LOCALHOST_ONLY: "0"
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      source /workspaces/code/install/setup.bash &&
      ros2 launch basic_topic publisher_component.launch.py"
    networks:
      - basic-net

  basic-subscriber:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-subscriber
    environment:
      ROS_DOMAIN_ID: "7"
      ROS_LOCALHOST_ONLY: "0"
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
      source /workspaces/code/install/setup.bash &&
      ros2 launch basic_topic subscriber_component.launch.py"
    networks:
      - basic-net

networks:
  basic-net:
    driver: bridge
