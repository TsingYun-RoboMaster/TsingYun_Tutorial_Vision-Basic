version: "3.8"

services:
  publisher:
    build:
      context: ..            
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-publisher-1
    command: /bin/bash -c "source /workspaces/code/install/setup.bash && ros2 run basic_topic publisher_node"

  subscriber:
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-subscriber-1
    command: /bin/bash -c "source /workspaces/code/install/setup.bash && ros2 run basic_topic subscriber_node"