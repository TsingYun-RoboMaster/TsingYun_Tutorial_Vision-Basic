services:
  publisher:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-publisher
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      source /workspaces/code/install/setup.bash &&
      ros2 run basic_topic publisher_component"
    environment:
      ROS_DOMAIN_ID: 0
    networks:
      - ros_network

  subscriber:
    image: basic:deploy
    build:
      context: ..
      dockerfile: docker/Dockerfile.deploy
    container_name: basic-subscriber
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
      source /workspaces/code/install/setup.bash &&
      ros2 run basic_topic subscriber_component"
    environment:
      ROS_DOMAIN_ID: 0
    depends_on:
      - publisher
    networks:
      - ros_network

networks:
  ros_network:
    driver: bridge
